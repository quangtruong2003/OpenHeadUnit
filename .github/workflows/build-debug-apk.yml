name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build GitHub and Dashcam debug APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleDashcamDebug --no-daemon --stacktrace

      - name: Upload GitHub debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-headunit-github-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Upload Dashcam debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-headunit-dashcam-debug
          path: app/build/outputs/apk/dashcam/debug/*.apk
          if-no-files-found: error
